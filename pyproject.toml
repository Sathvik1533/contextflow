[project]
name = "contextflow"
version = "0.1.0"
description = "Screen-aware AI learning assistant. One hotkey → AI reads your screen → context on clipboard."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-groq>=0.2.0",
    "langchain-core>=0.3.0",
    "mss>=9.0.0",
    "Pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]
hotkey = [
    "pynput>=1.7.0",      # global hotkey — requires display server, not for CI/servers
]
video = [
    "yt-dlp>=2024.0.0",   # video download
    "opencv-python>=4.9.0",  # frame extraction
    "openai-whisper>=20231117",  # audio transcription (local, free)
]
memory = [
    "chromadb>=0.5.0",    # vector store for session memory
]
all = [
    "pynput>=1.7.0",
    "yt-dlp>=2024.0.0",
    "opencv-python>=4.9.0",
    "openai-whisper>=20231117",
    "chromadb>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
