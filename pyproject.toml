[project]
name = "contextflow"
version = "0.1.0"
description = "Screen-aware AI learning assistant. One hotkey → AI reads your screen → context on clipboard."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-groq>=0.2.0",  # Groq for fast inference (Llama 3.2 Vision + Llama 3.3 Text)
    "langchain-core>=0.3.0",
    "mss>=9.0.0",
    "Pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "pynput>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
